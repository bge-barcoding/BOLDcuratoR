[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boldcurator"
version = "0.1.0.dev0"
description = "Offline curation of BOLD specimen records against a local data-package snapshot"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
gui = ["shiny>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
boldcurator = "boldcurator.cli:main"
boldcurator-build-snapshot = "boldcurator.build.snapshot_builder:main"
boldcurator-verify-snapshot = "boldcurator.build.verify:main"

[tool.hatch.build.targets.wheel]
packages = ["src/boldcurator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
