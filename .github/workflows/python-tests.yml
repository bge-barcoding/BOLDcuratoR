name: Python app tests

# Separate from test.yml (the R app's own workflow) -- this covers only
# python/, which test.yml never touches. Path-filtered so a change to the R
# app doesn't spend CI minutes running the Python suite and vice versa.

on:
  push:
    branches: [main, develop, 'claude/**']
    paths:
      - 'python/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -e ".[dev,gui]"

      - name: Run the test suite
        run: python -m pytest tests/ -q

      - name: No-GUI-dependency import check
        run: python -c "import boldcurator.cli"

  parity:
    # The gate before GUI work (parity/compare.py's own docstring). Linux
    # only -- it needs R, and the point is comparing scientific logic, which
    # does not vary by platform the way the desktop packaging matrix does.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the Python package
        working-directory: python
        run: pip install -e ".[dev]"

      - name: Install R
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-r6

      - name: Generate the shared parity fixture
        working-directory: python
        run: python parity/make_fixture.py

      - name: Run the R reference
        # --vanilla matters: the repo's .Rprofile bootstraps renv, which
        # tries to reach CRAN (parity/export_r_reference.R's own docstring).
        run: Rscript --vanilla python/parity/export_r_reference.R

      - name: Compare Python against the R reference
        working-directory: python
        run: python parity/compare.py

      - name: Upload the parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: python/parity/REPORT.md
