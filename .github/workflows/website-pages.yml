# Deploys the curator-facing project website (website/) to GitHub Pages.
#
# Plain static HTML/CSS/JS, no build step -- this just uploads website/ as
# the Pages artifact. Runs on any push to main that touches website/, and
# can be triggered manually to redeploy without a content change (e.g.
# after editing the release asset names it links to).
#
# The repo also has a separate, manual-only Pages workflow
# (spike-pages.yml) for an unrelated shinylive experiment. A GitHub Pages
# site is "whichever workflow last deployed to it", so the two coexist
# safely as long as spike-pages.yml is only ever run deliberately.

name: website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website-pages.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
