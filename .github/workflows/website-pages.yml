# Deploys the curator-facing project website (website/) to GitHub Pages.
#
# Plain static HTML/CSS/JS, no build step -- this just uploads website/ as
# the Pages artifact. Runs on any push to main that touches website/, and
# can be triggered manually to redeploy without a content change (e.g.
# after editing the release asset names it links to).
#
# The repo also has a separate, manual-only Pages workflow
# (spike-pages.yml) for an unrelated shinylive experiment. A GitHub Pages
# site is "whichever workflow last deployed to it", so the two coexist
# safely as long as spike-pages.yml is only ever run deliberately.

name: website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website-pages.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
