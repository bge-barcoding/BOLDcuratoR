name: Build desktop executables

# Plan 4.3: automated release builds, so a curator gets an executable
# without anyone running PyInstaller by hand. Fires on a version tag (a real
# release) or manually via workflow_dispatch (to validate the pipeline
# itself without cutting a release). See python/packaging/README.md for
# what --collect-all is doing and what has/hasn't actually been verified.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          # macos_target: the oldest macOS the build must still run on --
          # see packaging/macos_deployment_target.py for why this has to be
          # enforced rather than assumed (v3.2 silently needed macOS 15).
          - os: macos-15-intel # Intel; macos-13 was retired 2025-12-04
            name: macos-x86_64
            macos_target: '11.0'
          - os: macos-latest   # Apple Silicon
            name: macos-arm64
            macos_target: '11.0'
    runs-on: ${{ matrix.os }}
    # A runner label that stops resolving to any actual runner (macos-13's
    # retirement on 2025-12-04 did exactly this) queues forever rather than
    # failing -- this caps that at a clear failure instead of a silent hang
    # blocking the whole workflow.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: python
    env:
      # Anything compiled from source on the macOS runners targets the same
      # minimum as the wheels (empty, and ignored, on Windows/Linux).
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the app and PyInstaller
        run: |
          pip install -e ".[desktop]"
          pip install pyinstaller

      - name: macOS -- swap in wheels that run on older macOS
        # pip on a macOS 15 runner picks macOS-14/15-only wheels when a
        # package ships one (numpy, orjson did in v3.2); reinstall those
        # packages' macosx_<target> wheels before PyInstaller bundles them.
        if: runner.os == 'macOS'
        run: python packaging/macos_deployment_target.py repin --target ${{ matrix.macos_target }}

      - name: Build
        # macOS gets a real .app bundle (--windowed): Gatekeeper assesses a
        # bundle once, as a unit. The bare --onedir folder shipped up to
        # v3.2 made it assess every one of ~150 quarantined .so/.dylib
        # files separately -- an "Open Anyway" plus admin password for
        # each (packaging/README.md, "macOS: why a .app bundle").
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            platform_flags=(--windowed --name BOLDcurator
              --icon packaging/icon.icns
              --osx-bundle-identifier io.github.bge-barcoding.boldcurator)
          else
            platform_flags=(--name boldcurator)
          fi
          pyinstaller --onedir --paths src "${platform_flags[@]}" \
            --collect-all duckdb --collect-all shiny --collect-all htmltools \
            --collect-all shinychat --collect-all pywebview \
            --collect-all pythonnet --collect-all clr_loader \
            --collect-all Bio --collect-all boldcurator \
            packaging/entrypoint.py

      - name: Locate the built executable
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   echo "BIN=dist/BOLDcurator.app/Contents/MacOS/BOLDcurator" ;;
            Windows) echo "BIN=dist/boldcurator/boldcurator.exe" ;;
            *)       echo "BIN=dist/boldcurator/boldcurator" ;;
          esac >> "$GITHUB_ENV"

      - name: macOS -- every binary runs on the target macOS, and the bundle's signature is intact
        if: runner.os == 'macOS'
        run: |
          python packaging/macos_deployment_target.py check --target ${{ matrix.macos_target }} dist/BOLDcurator.app
          codesign --verify --deep --strict --verbose=2 dist/BOLDcurator.app

      - name: Smoke test -- selftest (no snapshot needed)
        # Catches a missing package data file before a curator does, same as
        # the shinychat/pywebview fixes above -- this is what caught the Bio
        # data directory (DistanceCalculator's class body,
        # Bio.Phylo.TreeConstruction) not being bundled, twice: once for
        # needing --collect-all at all, and once more when --collect-all
        # biopython (the PyPI name, not the "Bio" import name) turned out to
        # silently collect nothing -- see packaging/README.md. Runs first,
        # and without a snapshot, because it's the fastest of these three
        # checks.
        shell: bash
        run: |
          "$BIN" selftest

      - name: Build a tiny fixture snapshot to smoke-test against
        shell: bash
        run: |
          python tests/make_fake_package.py --out fake.tsv.gz --rows 200
          python tools/build_snapshot.py --tsv fake.tsv.gz --out fixture.duckdb \
            --memory-limit 512MB --threads 1 --no-hash

      - name: Smoke test -- the frozen CLI actually queries the snapshot
        shell: bash
        run: |
          "$BIN" info --snapshot fixture.duckdb

      - name: Smoke test -- the frozen GUI server actually starts
        # Catches a missing package data file before a curator does -- this
        # exact check is what caught shinychat needing its own
        # --collect-all during development (python/packaging/README.md).
        #
        # The second curl (the Phylogeny tab's own static JS) catches a
        # different, silent flavour of the same class of bug: the root URL
        # coming up proves the Shiny server started, but ui/static/phylo/ is
        # boldcurator's *own* data, never reached by any --collect-all for a
        # third-party dependency -- it 404s with no exception anywhere, so a
        # curator just sees a blank tree canvas with nothing in the app to
        # explain why. Found exactly this way on a real Windows build.
        shell: bash
        run: |
          "$BIN" gui --snapshot fixture.duckdb --port 8901 &
          pid=$!
          up=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8901/ >/dev/null 2>&1; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != "1" ]; then
            kill "$pid" 2>/dev/null || true
            echo "The frozen GUI server never came up"
            exit 1
          fi
          if ! curl -sf http://127.0.0.1:8901/phylo-assets/phylo-init.js >/dev/null 2>&1; then
            kill "$pid" 2>/dev/null || true
            echo "Phylogeny tab's static JS was not bundled (/phylo-assets/phylo-init.js 404s)"
            exit 1
          fi
          kill "$pid" 2>/dev/null || true

      - name: macOS -- zip the .app on the Mac, then check the zip itself
        # ditto, on the Mac, is the only step that may zip the .app:
        # upload-artifact plus a Linux `zip` (the release job's route for
        # the other platforms) drops every symlink -- v3.2 shipped
        # Python.framework four times over with its bundle structure, and
        # so its signature, broken. The check unzips it the way Finder
        # does and re-verifies what a curator actually gets.
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent dist/BOLDcurator.app "boldcurator-${{ matrix.name }}.zip"
          rm -rf ziptest && mkdir ziptest
          ditto -x -k "boldcurator-${{ matrix.name }}.zip" ziptest
          codesign --verify --deep --strict --verbose=2 ziptest/BOLDcurator.app
          ziptest/BOLDcurator.app/Contents/MacOS/BOLDcurator selftest

      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: boldcurator-${{ matrix.name }}
          path: python/dist/boldcurator

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: boldcurator-${{ matrix.name }}
          path: python/boldcurator-${{ matrix.name }}.zip

      # A second, independent way to deliver the Windows build: a real
      # setup.exe (Start Menu entry, optional desktop shortcut, an
      # uninstaller) wrapping the same dist/boldcurator/ output above --
      # see packaging/windows-installer.iss and packaging/README.md.
      - name: Build the Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

          # github.ref_name is the *tag* name on a real release (vX.Y.Z --
          # strip the v) but the *branch* name on a workflow_dispatch run,
          # e.g. "claude/wonderful-newton-qw7llz" -- which contains a "/"
          # and breaks OutputBaseFilename below (an actual CI failure this
          # caused). Only trust it as a version on an actual vX.Y.Z tag.
          if ("${{ github.ref }}" -match '^refs/tags/v(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]
          } else {
            $version = '0.0.0-dev'
          }

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" packaging\windows-installer.iss

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: boldcurator-windows-installer
          path: python/packaging/Output/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each Windows/Linux onedir build; stage the Windows installer and macOS zips as-is
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            name=$(basename "$d")
            case "$name" in
              boldcurator-windows-installer)
                cp "$d"*.exe release/ 2>/dev/null || true
                ;;
              boldcurator-macos-*)
                # Already zipped with ditto on the Mac -- never re-zip here
                # (see "zip the .app on the Mac" above).
                cp "$d$name.zip" release/
                ;;
              *)
                chmod +x "$d"boldcurator* 2>/dev/null || true
                (cd "$d" && zip -rq "$OLDPWD/release/${name}.zip" .)
                ;;
            esac
          done

      - name: List what's about to be released
        run: ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.exe
          generate_release_notes: true
