name: Build desktop executables

# Plan 4.3: automated release builds, so a curator gets an executable
# without anyone running PyInstaller by hand. Fires on a version tag (a real
# release) or manually via workflow_dispatch (to validate the pipeline
# itself without cutting a release). See python/packaging/README.md for
# what --collect-all is doing and what has/hasn't actually been verified.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-15-intel # Intel; macos-13 was retired 2025-12-04
            name: macos-x86_64
          - os: macos-latest   # Apple Silicon
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    # A runner label that stops resolving to any actual runner (macos-13's
    # retirement on 2025-12-04 did exactly this) queues forever rather than
    # failing -- this caps that at a clear failure instead of a silent hang
    # blocking the whole workflow.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the app and PyInstaller
        run: |
          pip install -e ".[desktop]"
          pip install pyinstaller

      - name: Build
        run: >-
          pyinstaller --onedir --name boldcurator --paths src
          --collect-all duckdb --collect-all shiny --collect-all htmltools
          --collect-all shinychat --collect-all pywebview
          --collect-all pythonnet --collect-all clr_loader
          --collect-all biopython
          packaging/entrypoint.py

      - name: Smoke test -- selftest (no snapshot needed)
        # Catches a missing package data file before a curator does, same as
        # the shinychat/pywebview fixes below -- this is what caught biopython
        # needing its own --collect-all: DistanceCalculator's class body
        # (Bio.Phylo.TreeConstruction) reads a data directory PyInstaller's
        # import analysis doesn't bundle unless told to. Runs first, and
        # without a snapshot, because it's the fastest of these three checks.
        shell: bash
        run: |
          BIN=dist/boldcurator/boldcurator
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          "$BIN" selftest

      - name: Build a tiny fixture snapshot to smoke-test against
        shell: bash
        run: |
          python tests/make_fake_package.py --out fake.tsv.gz --rows 200
          python tools/build_snapshot.py --tsv fake.tsv.gz --out fixture.duckdb \
            --memory-limit 512MB --threads 1 --no-hash

      - name: Smoke test -- the frozen CLI actually queries the snapshot
        shell: bash
        run: |
          BIN=dist/boldcurator/boldcurator
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          "$BIN" info --snapshot fixture.duckdb

      - name: Smoke test -- the frozen GUI server actually starts
        # Catches a missing package data file before a curator does -- this
        # exact check is what caught shinychat needing its own
        # --collect-all during development (python/packaging/README.md).
        shell: bash
        run: |
          BIN=dist/boldcurator/boldcurator
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          "$BIN" gui --snapshot fixture.duckdb --port 8901 &
          pid=$!
          up=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8901/ >/dev/null 2>&1; then up=1; break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          if [ "$up" != "1" ]; then
            echo "The frozen GUI server never came up"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: boldcurator-${{ matrix.name }}
          path: python/dist/boldcurator

      # A second, independent way to deliver the Windows build: a real
      # setup.exe (Start Menu entry, optional desktop shortcut, an
      # uninstaller) wrapping the same dist/boldcurator/ output above --
      # see packaging/windows-installer.iss and packaging/README.md.
      - name: Build the Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

          # github.ref_name is the *tag* name on a real release (vX.Y.Z --
          # strip the v) but the *branch* name on a workflow_dispatch run,
          # e.g. "claude/wonderful-newton-qw7llz" -- which contains a "/"
          # and breaks OutputBaseFilename below (an actual CI failure this
          # caused). Only trust it as a version on an actual vX.Y.Z tag.
          if ("${{ github.ref }}" -match '^refs/tags/v(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]
          } else {
            $version = '0.0.0-dev'
          }

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" packaging\windows-installer.iss

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: boldcurator-windows-installer
          path: python/packaging/Output/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform's onedir build; stage the Windows installer as-is
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            name=$(basename "$d")
            if [ "$name" = "boldcurator-windows-installer" ]; then
              cp "$d"*.exe release/ 2>/dev/null || true
              continue
            fi
            chmod +x "$d"boldcurator* 2>/dev/null || true
            (cd "$d" && zip -rq "$OLDPWD/release/${name}.zip" .)
          done

      - name: List what's about to be released
        run: ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.exe
          generate_release_notes: true
