name: Build desktop executables

# Plan 4.3: automated release builds, so a curator gets an executable
# without anyone running PyInstaller by hand. See python/packaging/README.md
# for what --collect-all is doing and what has/hasn't actually been verified.
#
# Fires when a GitHub release is published, whatever its tag looks like.
# Up to v3.3 this fired on a pushed tag matching 'v*' instead -- and GitHub's
# tag filters are case-sensitive, so V3.3 (capital V) silently got no
# executables, and the website's releases/latest/download/... buttons all
# 404'd until it was backfilled.
#
# Every release is built fresh and gets the full set of RELEASE_ASSETS
# attached, each reporting that release's own version: the tag is stamped
# into pyproject.toml (python/packaging/stamp_version.py, the same script
# python-pypi.yml uses) before PyInstaller bundles the package metadata that
# boldcurator.__version__ reads. Up to now a release with no python/ changes
# re-attached the previous release's files instead -- fast, but those still
# said the older version.
#
# workflow_dispatch has two uses:
#  - no tag: build on the chosen branch to validate the pipeline itself, and
#    publish nothing (how every packaging fix so far was tested);
#  - a tag: backfill (or rebuild) an existing release's executables. The
#    workflow definition -- and stamp_version.py, so even a tag older than
#    that script can be stamped -- comes from the branch you run it on, the
#    code that gets built from the tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach executables to (blank = build only, publish nothing)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # Every release must end up with exactly these, under exactly these names:
  # website/index.html links straight to releases/latest/download/<name>
  # (website/README.md, "Download links").
  RELEASE_ASSETS: >-
    boldcurator-linux-x86_64.zip
    boldcurator-windows-x86_64.zip
    boldcurator-macos-x86_64.zip
    boldcurator-macos-arm64.zip
    BOLDcuratorSetup-x64.exe

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every tag, so the requested one can be checked

      - name: Which tag, and does it have a release?
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }

          if [ "$EVENT" = release ]; then tag="$RELEASE_TAG"; else tag="$INPUT_TAG"; fi

          if [ -z "$tag" ]; then
            out tag ""
            out ref "$GITHUB_SHA"
            echo "Pipeline check on $GITHUB_REF: building, publishing nothing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            echo "::error::No tag named '$tag' in this repository"
            exit 1
          fi
          if ! gh release view "$tag" --json tagName >/dev/null; then
            echo "::error::Tag '$tag' has no GitHub release to attach executables to -- create the release first"
            exit 1
          fi

          out tag "$tag"
          out ref "refs/tags/$tag"
          echo "**$tag**: building." >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          # macos_target: the oldest macOS the build must still run on --
          # see packaging/macos_deployment_target.py for why this has to be
          # enforced rather than assumed (v3.2 silently needed macOS 15).
          - os: macos-15-intel # Intel; macos-13 was retired 2025-12-04
            name: macos-x86_64
            macos_target: '11.0'
          - os: macos-latest   # Apple Silicon
            name: macos-arm64
            macos_target: '11.0'
    runs-on: ${{ matrix.os }}
    # A runner label that stops resolving to any actual runner (macos-13's
    # retirement on 2025-12-04 did exactly this) queues forever rather than
    # failing -- this caps that at a clear failure instead of a silent hang
    # blocking the whole workflow.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: python
    env:
      # Anything compiled from source on the macOS runners targets the same
      # minimum as the wheels (empty, and ignored, on Windows/Linux).
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}

      # stamp_version.py from the workflow's own commit, not the tag's: a
      # backfill of a tag older than the script still gets stamped.
      - uses: actions/checkout@v4
        with:
          path: .release-tools
          sparse-checkout: python/packaging/stamp_version.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stamp the release version into pyproject.toml
        # Before the install, so the package metadata PyInstaller bundles
        # (--collect-all boldcurator) -- and so boldcurator.__version__, the
        # app header, --version and the Zenodo User-Agent -- carry the
        # release's version, not the placeholder in git. V3.3 -> 3.3.0; a
        # build-only run (no tag) gets 0.0.0.dev0.
        id: version
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          version=$(python ../.release-tools/python/packaging/stamp_version.py \
            --pyproject pyproject.toml "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Stamped version $version"

      - name: Install the app and PyInstaller
        run: |
          pip install -e ".[desktop]"
          pip install pyinstaller

      - name: macOS -- swap in wheels that run on older macOS
        # pip on a macOS 15 runner picks macOS-14/15-only wheels when a
        # package ships one (numpy, orjson did in v3.2); reinstall those
        # packages' macosx_<target> wheels before PyInstaller bundles them.
        if: runner.os == 'macOS'
        run: python packaging/macos_deployment_target.py repin --target ${{ matrix.macos_target }}

      - name: Build
        # macOS gets a real .app bundle (--windowed): Gatekeeper assesses a
        # bundle once, as a unit. The bare --onedir folder shipped up to
        # v3.2 made it assess every one of ~150 quarantined .so/.dylib
        # files separately -- an "Open Anyway" plus admin password for
        # each (packaging/README.md, "macOS: why a .app bundle").
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            platform_flags=(--windowed --name BOLDcurator
              --icon packaging/icon.icns
              --osx-bundle-identifier io.github.bge-barcoding.boldcurator)
          else
            platform_flags=(--name boldcurator)
          fi
          pyinstaller --onedir --paths src "${platform_flags[@]}" \
            --collect-all duckdb --collect-all shiny --collect-all htmltools \
            --collect-all shinychat --collect-all pywebview \
            --collect-all pythonnet --collect-all clr_loader \
            --collect-all Bio --collect-all boldcurator \
            packaging/entrypoint.py

      - name: Locate the built executable
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   echo "BIN=dist/BOLDcurator.app/Contents/MacOS/BOLDcurator" ;;
            Windows) echo "BIN=dist/boldcurator/boldcurator.exe" ;;
            *)       echo "BIN=dist/boldcurator/boldcurator" ;;
          esac >> "$GITHUB_ENV"

      - name: macOS -- every binary runs on the target macOS, and the bundle's signature is intact
        if: runner.os == 'macOS'
        run: |
          python packaging/macos_deployment_target.py check --target ${{ matrix.macos_target }} dist/BOLDcurator.app
          codesign --verify --deep --strict --verbose=2 dist/BOLDcurator.app

      - name: Smoke test -- the build reports the release's version
        # An unstamped build (the git placeholder, 0.0.0.dev0, on a real
        # release) fails here rather than shipping with the wrong version.
        shell: bash
        run: |
          reported=$("$BIN" --version | tr -d '\r')
          echo "$reported"
          [ "$reported" = "boldcurator $VERSION" ] || {
            echo "::error::Built app reports '$reported', expected 'boldcurator $VERSION'"
            exit 1
          }

      - name: Smoke test -- selftest (no snapshot needed)
        # Catches a missing package data file before a curator does, same as
        # the shinychat/pywebview fixes above -- this is what caught the Bio
        # data directory (DistanceCalculator's class body,
        # Bio.Phylo.TreeConstruction) not being bundled, twice: once for
        # needing --collect-all at all, and once more when --collect-all
        # biopython (the PyPI name, not the "Bio" import name) turned out to
        # silently collect nothing -- see packaging/README.md. Runs first,
        # and without a snapshot, because it's the fastest of these three
        # checks.
        shell: bash
        run: |
          "$BIN" selftest

      - name: Smoke test -- HTTPS to Zenodo with no OpenSSL CA file to fall back on
        # V3.3's macOS build failed every Zenodo request with
        # CERTIFICATE_VERIFY_FAILED on a curator's Mac but never here: the
        # CA path compiled into the bundled OpenSSL happens to exist on the
        # runner. Pointing SSL_CERT_FILE/SSL_CERT_DIR at nothing recreates
        # the curator's machine, so this passes only if HTTPS really goes
        # through the OS trust store (fetch_snapshot.ssl_context). Needs
        # Zenodo to be up -- if it's down, re-run rather than skip.
        shell: bash
        run: |
          SSL_CERT_FILE=/nonexistent SSL_CERT_DIR=/nonexistent "$BIN" selftest --network

      - name: Build a tiny fixture snapshot to smoke-test against
        shell: bash
        run: |
          python tests/make_fake_package.py --out fake.tsv.gz --rows 200
          python tools/build_snapshot.py --tsv fake.tsv.gz --out fixture.duckdb \
            --memory-limit 512MB --threads 1 --no-hash

      - name: Smoke test -- the frozen CLI actually queries the snapshot
        shell: bash
        run: |
          "$BIN" info --snapshot fixture.duckdb

      - name: Smoke test -- the frozen GUI server actually starts
        # Catches a missing package data file before a curator does -- this
        # exact check is what caught shinychat needing its own
        # --collect-all during development (python/packaging/README.md).
        #
        # The second curl (the Phylogeny tab's own static JS) catches a
        # different, silent flavour of the same class of bug: the root URL
        # coming up proves the Shiny server started, but ui/static/phylo/ is
        # boldcurator's *own* data, never reached by any --collect-all for a
        # third-party dependency -- it 404s with no exception anywhere, so a
        # curator just sees a blank tree canvas with nothing in the app to
        # explain why. Found exactly this way on a real Windows build.
        shell: bash
        run: |
          "$BIN" gui --snapshot fixture.duckdb --port 8901 &
          pid=$!
          up=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8901/ >/dev/null 2>&1; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != "1" ]; then
            kill "$pid" 2>/dev/null || true
            echo "The frozen GUI server never came up"
            exit 1
          fi
          if ! curl -sf http://127.0.0.1:8901/phylo-assets/phylo-init.js >/dev/null 2>&1; then
            kill "$pid" 2>/dev/null || true
            echo "Phylogeny tab's static JS was not bundled (/phylo-assets/phylo-init.js 404s)"
            exit 1
          fi
          kill "$pid" 2>/dev/null || true

      - name: macOS -- zip the .app on the Mac, then check the zip itself
        # ditto, on the Mac, is the only step that may zip the .app:
        # upload-artifact plus a Linux `zip` (the release job's route for
        # the other platforms) drops every symlink -- v3.2 shipped
        # Python.framework four times over with its bundle structure, and
        # so its signature, broken. The check unzips it the way Finder
        # does and re-verifies what a curator actually gets.
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent dist/BOLDcurator.app "boldcurator-${{ matrix.name }}.zip"
          rm -rf ziptest && mkdir ziptest
          ditto -x -k "boldcurator-${{ matrix.name }}.zip" ziptest
          codesign --verify --deep --strict --verbose=2 ziptest/BOLDcurator.app
          ziptest/BOLDcurator.app/Contents/MacOS/BOLDcurator selftest

      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: boldcurator-${{ matrix.name }}
          path: python/dist/boldcurator

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: boldcurator-${{ matrix.name }}
          path: python/boldcurator-${{ matrix.name }}.zip

      # A second, independent way to deliver the Windows build: a real
      # setup.exe (Start Menu entry, optional desktop shortcut, an
      # uninstaller) wrapping the same dist/boldcurator/ output above --
      # see packaging/windows-installer.iss and packaging/README.md.
      - name: Build the Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

          # The version stamped above: the release tag padded to x.y.z
          # (V3.3 -> 3.3.0), or 0.0.0.dev0 on a build-only run. Never the
          # raw ref: on workflow_dispatch that's a branch name like
          # "claude/foo-qw7llz", whose "/" broke OutputBaseFilename (an
          # actual CI failure).
          $version = '${{ steps.version.outputs.version }}'

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" packaging\windows-installer.iss

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: boldcurator-windows-installer
          path: python/packaging/Output/*.exe

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each Windows/Linux onedir build; stage the Windows installer and macOS zips as-is
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            name=$(basename "$d")
            case "$name" in
              boldcurator-windows-installer)
                cp "$d"*.exe release/
                ;;
              boldcurator-macos-*)
                # Already zipped with ditto on the Mac -- never re-zip here
                # (see "zip the .app on the Mac" above).
                cp "$d$name.zip" release/
                ;;
              *)
                chmod +x "$d"boldcurator* 2>/dev/null || true
                (cd "$d" && zip -rq "$OLDPWD/release/${name}.zip" .)
                ;;
            esac
          done

      - name: Check every asset the website links to is there
        run: |
          ls -la release/
          missing=0
          for a in $RELEASE_ASSETS; do
            [ -f "release/$a" ] || { echo "::error::Missing release asset: $a"; missing=1; }
          done
          exit "$missing"

      - name: Attach to the release
        # --clobber: re-running (or a backfill) replaces what's
        # there. Only the assets are touched -- the release notes are left
        # exactly as written.
        run: |
          gh release upload "$TAG" release/* --clobber
          echo "Attached freshly built executables to $TAG." >> "$GITHUB_STEP_SUMMARY"
