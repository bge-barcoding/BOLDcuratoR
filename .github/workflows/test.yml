name: Tests

# The R Shiny app's testthat suite (tests/testthat). python/ has its own
# workflow (python-tests.yml); this one is path-filtered to the R app so a
# Python-only change doesn't spend CI minutes here, and vice versa.

on:
  push:
    branches: [main, develop, 'claude/**']
    paths:
      - 'R/**'
      - 'tests/**'
      - 'app.R'
      - 'global.R'
      - 'config/**'
      - 'about.md'
      - 'DESCRIPTION'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'R/**'
      - 'tests/**'
      - 'app.R'
      - 'global.R'
      - 'config/**'
      - 'about.md'
      - 'DESCRIPTION'
      - '.github/workflows/test.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # The repo's .Rprofile activates renv, which then takes over package
      # installation and tries to restore the app's full renv.lock (~20
      # minutes, and it has failed outright on packages the tests never
      # load). The suite needs only the handful of packages listed below.
      RENV_ACTIVATE_PROJECT: 'false'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 4.3.x, not the renv.lock's 4.4: DESCRIPTION promises R >= 4.1, and an
      # older R catches base functions that only exist in newer ones (%||%
      # arrived in 4.4.0 and has broken this suite before).
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: '4.3.2'
          use-public-rspm: true

      # Exactly what the sourced R/ files and the tests themselves load --
      # keep in step with tests/testthat when a test starts sourcing a file
      # that needs another package.
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          packages: |
            any::testthat
            any::R6
            any::jsonlite
            any::digest
            any::DBI
            any::RSQLite
            any::writexl
            any::shiny
            any::shinydashboard
            any::DT
            any::markdown

      - name: Run tests
        run: |
          Rscript --vanilla -e 'testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)'
