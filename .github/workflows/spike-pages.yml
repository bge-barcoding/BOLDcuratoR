# Deploys the shinylive spike to GitHub Pages.
#
# Manual-only: this is throwaway spike infrastructure, not part of the app's CI,
# and it should never run on a push to a feature branch.
#
# Local testing (Rscript export.R) is the primary path. Pages exists only to
# measure the real cold-load path over a network. Note GitHub's 100 MB per-file
# limit: only the SMALL fixture can be deployed here. The 200 MB and 400 MB
# measurements have to be taken over localhost.
name: spike-shinylive-pages

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Synthetic fixture rows (keep the .data under 100 MB for Pages)"
        default: "1000000"
        required: false

permissions:
  contents: read

concurrency:
  group: spike-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike/shinylive-duckdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          packages: |
            any::shinylive
            any::httpuv
            any::duckdb
            any::DBI
            any::shiny
          working-directory: spike/shinylive-duckdb

      - name: Build fixture
        # Via env, never ${{ }} straight into the script: a dispatch input is
        # free text, and interpolating it would let it inject shell.
        env:
          ROWS: ${{ inputs.rows || '1000000' }}
        run: Rscript build_fixture.R --synthetic --rows "$ROWS"

      - name: Set up Emscripten (file_packager)
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14

      # The image is NOT staged into app/: shinylive bundles everything under the
      # app directory into its payload, which breaks the app outright above
      # ~100 MB. export.R copies it into site/ beside the app instead.
      - name: Package fixture as WORKERFS image
        run: ./package_fixture.sh fixtures/bold_spike_01.duckdb

      - name: Export shinylive site
        run: Rscript export.R --no-serve

      - name: Fail if any asset exceeds GitHub's 100 MB file limit
        run: |
          big=$(find site -type f -size +100M -print)
          if [ -n "$big" ]; then
            echo "These exceed 100 MB and cannot be served from Pages:"
            echo "$big"
            echo "Measure the larger fixtures over localhost instead (see README)."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: spike/shinylive-duckdb/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
