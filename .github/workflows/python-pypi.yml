name: Publish to PyPI

# The pip/uv distribution route: `uv tool install "boldcurator[desktop]"`,
# which is what website/install.sh and install.ps1 run. Kept out of
# python-release.yml on purpose, so the desktop installers' pipeline is
# untouched by it -- the two run side by side on the same release.
#
# Fires when a GitHub release is published, like python-release.yml. The
# release tag becomes the package version, padded to x.y.z by
# python/packaging/stamp_version.py -- the same script python-release.yml
# stamps the desktop builds with (V3.3 -> 3.3.0). pyproject.toml keeps its
# placeholder version in git; only this job's own checkout is stamped.
#
# Publishing uses PyPI trusted publishing (OIDC) -- no API token is stored
# anywhere. One-time setup on pypi.org: add a (pending) trusted publisher
# for project "boldcurator", repository bge-barcoding/BOLDcuratoR, workflow
# python-pypi.yml, environment "pypi" -- and create that environment under
# the repository's Settings -> Environments.
#
# Trusted publishing also makes PyPI generate and publish PEP 740
# attestations for each file, tying it to this workflow and commit (see the
# "Provenance" panel on pypi.org, or `pypi-attestations verify pypi`). The
# `github-release` job then attaches the very same sdist and wheel to the
# GitHub release, with GitHub build-provenance attestations and lines in the
# release's SHA256SUMS.txt.
#
# workflow_dispatch with no tag builds and checks the package but publishes
# nothing -- the way to test this workflow itself. With a tag it publishes
# that release's code (a backfill); a version already on PyPI is skipped.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (blank = build and check only, publish nothing)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: python-pypi-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Which tag?
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = release ]; then tag="$RELEASE_TAG"; else tag="$INPUT_TAG"; fi
          # A dispatch input is free text: refuse anything but the release
          # tag shapes stamp_version.py --strict accepts (v3.5.1, V3.3, 3),
          # before it can reach $GITHUB_OUTPUT or a checkout.
          tag_shape='^[vV]?[0-9]+(\.[0-9]+){0,2}$'
          if [ -n "$tag" ] && ! [[ "$tag" =~ $tag_shape ]]; then
            echo "::error::'$tag' is not a release tag (expected e.g. v3.5.1)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then echo "ref=refs/tags/$tag"; else echo "ref=$GITHUB_SHA"; fi >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.tag.outputs.ref }}
          fetch-depth: 0 # the default branch too, for the check below

      - name: Only reviewed code is published -- the tag must be on the default branch
        # Same rule as python-release.yml's plan job: every release so far
        # is tagged on main, and a tag pointing anywhere else (code that
        # never went through main) is refused rather than sent to PyPI.
        if: steps.tag.outputs.tag != ''
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "::error::This tag's commit is not on $DEFAULT_BRANCH -- merge it first, then tag"
            exit 1
          fi

      # stamp_version.py from the workflow's own commit, not the tag's: a
      # backfill of a tag older than the script still gets stamped.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: .release-tools
          sparse-checkout: python/packaging/stamp_version.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Stamp the version from the release tag
        id: version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # --strict: never guess -- a version on PyPI can't be reused or
          # renamed. The same script stamps the desktop builds
          # (python-release.yml), so the two can't disagree.
          version=$(python .release-tools/python/packaging/stamp_version.py \
            --strict --pyproject python/pyproject.toml "$TAG")
          if [ -z "$TAG" ]; then publish=false; else publish=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "**boldcurator $version** -- publish: $publish" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the sdist and wheel
        working-directory: python
        run: |
          pip install build
          python -m build

      - name: Check the built wheel installs and runs
        working-directory: python
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv /tmp/check
          wheel=$(ls dist/*.whl)
          /tmp/check/bin/pip install "$wheel[desktop]"
          /tmp/check/bin/boldcurator --version | grep -qx "boldcurator $VERSION"
          /tmp/check/bin/boldcurator selftest
          test -x /tmp/check/bin/boldcurator-desktop

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: python/dist/

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/boldcurator/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # A re-run, or a release republished with no new code, must not
          # fail on a version PyPI already has.
          skip-existing: true
          # PEP 740 attestations (the action's default under trusted
          # publishing -- stated so it can't be switched off by accident).
          attestations: true

  github-release:
    # The same sdist and wheel PyPI got, on the GitHub release too: so a
    # reviewer can `gh attestation verify` them and find them in
    # SHA256SUMS.txt alongside the desktop builds.
    needs: [build, publish]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # gh release upload
      id-token: write     # sign the attestations (Sigstore, via OIDC)
      attestations: write # store them on the repository
    # Shared with python-release.yml's publish job: both rewrite the same
    # release's SHA256SUMS.txt, so they take turns.
    concurrency:
      group: release-assets-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: dist/

      - name: Build provenance for the sdist and wheel
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Merge their checksums into the release's SHA256SUMS.txt
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- *) > mine.txt
          gh release download "$TAG" --pattern SHA256SUMS.txt --output existing.txt --clobber 2>/dev/null || : > existing.txt
          awk 'NR==FNR { mine[$2] = 1; next } !($2 in mine)' mine.txt existing.txt > merged.txt
          cat mine.txt >> merged.txt
          mkdir -p sums && sort -k2 merged.txt > sums/SHA256SUMS.txt
          cat sums/SHA256SUMS.txt

      - name: Build provenance for the checksum file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sums/SHA256SUMS.txt

      - name: Attach to the release
        run: |
          gh release upload "$TAG" dist/* sums/SHA256SUMS.txt --clobber
          echo "Attached the sdist, wheel and updated SHA256SUMS.txt to $TAG." >> "$GITHUB_STEP_SUMMARY"
